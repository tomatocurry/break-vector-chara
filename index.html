function ranksHTML(){return `<div class="panel"><b>TOP 5 / SCORE</b>${ranks.length?ranks.map((r,i)=>`<div class="rankrow"><span>${i+1}</span><span>${esc(r.name)} <small>(${esc(models[r.unit]?.name||r.unit||'旧機体')})</small></span><span>${r.score.toLocaleString()} / ${fmt(r.time)}</span></div>`).join(''):'<p>まだ記録はありません</p>'}</div>`}
function title(){phase='title';paused=false;voiceT=0;dialogQueue=[];dialogPriority=0;dash=null;dodgeOrigin=null;dodgeClaims.clear();$('#dialog').classList.add('hide');$('#pause').classList.add('hide');overlay.classList.remove('hide');overlay.innerHTML=`<small>v0.18 / TACTICAL ACTION</small><h1>BREAK VECTOR</h1><p>v0.16ベースの3WAVE・スコアアタック。攻撃射角を絞り、ドロシーの回避・吹き飛ばし・突撃を強化した操作検証版です。画像なしでも動作します。</p><h2>キャラクター選択</h2><div class="crafts">${Object.entries(models).map(([id,c])=>`<button class="craft" data-unit="${id}"><b>${c.name}</b><br>${c.desc}<br>HP ${c.hp} / 速度 ${c.speed}</button>`).join('')}</div><div class="panel">WAVE 1：雑魚5機 / WAVE 2：雑魚6機 / WAVE 3：ボス<br>中央スティック＝移動・向き。通常射撃は扇形内で自動（ドロシーを除く）。<br>シルヴィア：A反転・Dガード・S広角砲撃<br>リサ：A反転・D回避・S狭角重撃<br>アヤメ：A反転・D一時加速・S広域砲撃<br>ドロシー：A吹飛（敵同士の衝突あり）・D回避成功でゲージ／S覚醒中はA突撃・D広域攻撃<br>PC：WASD/矢印移動、J=A、K=D、L=S</div>${ranksHTML()}<button id="start" class="primary">戦闘開始</button>`;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{selected=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('selected',x.dataset.unit===selected))});$(`[data-unit="${selected}"]`).classList.add('selected');$('#start').onclick=start}
function start(){phase='play';paused=false;overlay.classList.add('hide');$('#pause').classList.remove('hide');p={x:WORLD.w/2,y:WORLD.h*.68,a:-Math.PI/2,hp:models[selected].hp,max:models[selected].hp,s:0};enemies=[];wave=0;kills=spawned=total=score=combo=maxCombo=0;comboTime=elapsed=clock=shotCD=defCD=guard=dodge=over=hitFlash=shake=noticeT=scut=phaseDelay=0;waveDamaged=false;boost=dorothyMode=skillCD=knockCD=voiceT=faceT=0;dialogQueue=[];dialogPriority=0;dash=null;dashTrails=[];knockTrails=[];dodgeOrigin=null;dodgeClaims.clear();faceState='normal';prevPortrait='';bullets=[];particles=[];texts=[];setPortrait('normal');nextWave();say(lines[selected].start,'normal',3.1,2);hud()}
function nextWave(){dialogQueue=[];wave++;kills=0;spawned=0;total=wave===1?5:wave===2?6:1;enemies=[];phaseDelay=0;waveDamaged=false;notice=wave===3?'WARNING / BOSS APPROACH':'WAVE '+wave;noticeT=1.5;fillSpawns();if(wave===3)say(lines[selected].boss,'advantage',4.0,3);else if(wave===2)say(lines[selected].wave,'normal',3.0,2)}
function fillSpawns(){const max=wave===3?1:3;while(enemies.length<max&&spawned<total){spawned++;const boss=wave===3,type=boss?'boss':wave===2&&spawned%2===0?'ranger':'grunt',angle=rand(0,Math.PI*2),r=rand(300,560),x=clamp(p.x+Math.cos(angle)*r,90,WORLD.w-90),y=clamp(p.y+Math.sin(angle)*r,90,WORLD.h-90);const hp=boss?750:type==='ranger'?115:85;enemies.push({id:spawned,type,x,y,a:angle+Math.PI,hp,max:hp,br:0,stun:0,wind:0,attackCD:rand(2.0,3.3),dir:0,recover:0,shot:0,r:boss?54:type==='ranger'?28:24,move:rand(60,100)})}}

function tagHit(target,base,br=6,sp=false){if(!target||target.hp<=0)return;const rel=Math.abs(adiff(Math.atan2(p.y-target.y,p.x-target.x),target.a)),mult=rel>Math.PI*2/3?1.5:rel>Math.PI/3?1.3:1,flank=mult>=1.5?'BACK ATTACK':mult>1?'FLANK':'';const actual=Math.round(base*mult*(target.stun>0?2:1));target.hp-=actual;target.br=clamp(target.br+br*(mult>=1.5?1.6:mult>1?1.35:1),0,100);p.s=clamp(p.s+(sp?0:mult>1?14:9),0,100);comboTime=Math.max(comboTime,Math.min(4,comboTime+.27));bullets.push({x:p.x,y:p.y,tx:target.x,ty:target.y,t:.12,sp});particlesAt(target.x,target.y,sp?'#ffe9a0':'#a9f5ff',sp?24:8);floatText(target.x,target.y-22,`${actual}${mult>1?' ×'+mult.toFixed(1):''}`,mult>1?'#ffd688':'#d6faff');if(flank&&Math.random()<.5)floatText(target.x,target.y-48,flank,'#ffd18b');if(target.br>=100&&target.stun<=0){target.br=0;target.stun=2.55;target.wind=0;floatText(target.x,target.y-55,'BREAK!','#ffe185',true);if(Math.random()<.35)say(lines[selected].break,'advantage',2.7,1);particlesAt(target.x,target.y,'#ffe185',25)}if(target.hp<=0){particlesAt(target.x,target.y,'#ffb6a7',30);combo++;maxCombo=Math.max(maxCombo,combo);comboTime=4;kills++;const basePts=target.type==='boss'?1000:target.type==='ranger'?200:100;addScore(basePts,target.x,target.y,'K.O.');if(mult>1)addScore(mult>=1.5?100:50,target.x,target.y-45,flank);if(target.stun>0)addScore(100,target.x,target.y-65,'BREAK FINISH');enemies=enemies.filter(e=>e!==target);if(kills>=total){if(!waveDamaged)addScore(300,p.x,p.y-40,'NO DAMAGE');if(wave===3)finish(true);else{phaseDelay=1.2;notice='WAVE CLEAR';noticeT=1.2}}else fillSpawns()}}

for(const b of bullets){ctx.globalAlpha=Math.min(1,b.t/.12);ctx.strokeStyle=b.sp?'#ffe6ad':'#98ebff';ctx.lineWidth=b.sp?8:3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=11;ctx.beginPath();ctx.moveTo(X(b.x),Y(b.y));ctx.lineTo(X(b.tx),Y(b.ty));ctx.stroke();ctx.shadowBlur=0}ctx.globalAlpha=1;for(const q of particles){ctx.globalAlpha=Math.max(0,q.t/q.max);ctx.fillStyle=q.c;ctx.fillRect(X(q.x),Y(q.y),3,3)}ctx.globalAlpha=1;for(const f of texts){ctx.globalAlpha=f.t/f.max;ctx.fillStyle=f.c;ctx.font=`900 ${f.big?17:13}px system-ui`;ctx.textAlign='center';ctx.fillText(f.label,X(f.x),Y(f.y))}ctx.globalAlpha=1;
for(const e of enemies){const x=X(e.x),y=Y(e.y);if(x>-10&&x<w+10&&y>-10&&y<h+10)continue;const tx=clamp(x,22,w-22),ty=clamp(y,95,h-48);ctx.fillStyle='#f7b4c3';ctx.beginPath();ctx.arc(tx,ty,7,0,7);ctx.fill()}
if(dorothyMode>0){ctx.strokeStyle='#ba98e9';ctx.lineWidth=3;ctx.strokeRect(4,4,w-8,h-8)}if(hitFlash>0){ctx.fillStyle=`rgba(255,208,221,${hitFlash*.35})`;ctx.fillRect(0,0,w,h)}if(noticeT>0){ctx.textAlign='center';ctx.fillStyle='#ffe5a3';ctx.font='900 22px system-ui';ctx.fillText(notice,w/2,h*.20)}
if(scut>0){const t=scut/.62,col=scutType==='sylvia'?'#86e6f0':scutType==='lisa'?'#d0aaff':scutType==='ayame'?'#ffc48f':'#f1a7df',name=models[scutType].s.toUpperCase();ctx.fillStyle='#081522b9';ctx.fillRect(0,0,w,h);ctx.fillStyle='#16384eea';ctx.beginPath();ctx.moveTo(0,h*.22);ctx.lineTo(w,h*.15);ctx.lineTo(w,h*.36);ctx.lineTo(0,h*.42);ctx.closePath();ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=4;ctx.stroke();const key=scutType+'Cutin';if(imgs[key]?.ready){const im=imgs[key].im,iw=Math.min(w*.42,190),ih=h*.25;ctx.drawImage(im,9,h*.17,iw,ih)}else{ctx.font='900 52px system-ui';ctx.fillStyle=col;ctx.textAlign='left';ctx.fillText(models[scutType].name[0],24,h*.34)}ctx.fillStyle=col;ctx.textAlign='center';ctx.font='900 14px system-ui';ctx.fillText('SPECIAL ACTION',w*.5,h*.245);ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.fillText(name,w*.5,h*.29);ctx.fillStyle='#243e59';ctx.fillRect(w*.2,h*.77,w*.6,12);ctx.fillStyle=col;ctx.fillRect(w*.2,h*.77,w*.6*(1-t),12);ctx.font='bold 12px system-ui';ctx.fillText('CHARGING',w*.5,h*.75)}ctx.restore()}
function frame(ms){const dt=last?Math.min(.035,(ms-last)/1000):0;last=ms;tick(dt);draw();requestAnimationFrame(frame)}
function stickUpdate(ev){const r=$('#stick').getBoundingClientRect(),x=ev.clientX-(r.left+r.width/2),y=ev.clientY-(r.top+r.height/2),l=Math.hypot(x,y)||1,max=r.width*.33,strength=Math.min(1,l/max),k=Math.min(l,max)/l;joy={x:x/l*strength,y:y/l*strength};$('#nub').style.left=`calc(50% + ${x*k}px)`;$('#nub').style.top=`calc(50% + ${y*k}px)`}function resetStick(){stickId=null;joy={x:0,y:0};$('#nub').style.left='50%';$('#nub').style.top='50%'}$('#stick').addEventListener('pointerdown',ev=>{stickId=ev.pointerId;$('#stick').setPointerCapture(ev.pointerId);stickUpdate(ev);ev.preventDefault()});$('#stick').addEventListener('pointermove',ev=>{if(stickId===ev.pointerId)stickUpdate(ev)});for(const name of ['pointerup','pointercancel','lostpointercapture'])$('#stick').addEventListener(name,ev=>{if(stickId===ev.pointerId)resetStick()});$('#fire').onclick=reverse;$('#def').onclick=defend;$('#special').onclick=special;window.addEventListener('keydown',ev=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(ev.key))ev.preventDefault();keys[ev.key]=true;if(ev.repeat)return;const k=ev.key.toLowerCase();if(k==='j')reverse();if(k==='k')defend();if(k==='l')special();if(k==='p')togglePause()});window.addEventListener('keyup',ev=>keys[ev.key]=false);function togglePause(){if(phase!=='play')return;paused=!paused;$('#pause').textContent=paused?'再開':'一時停止';if(paused){overlay.classList.remove('hide');overlay.innerHTML='<h1>PAUSE</h1><button id="resume" class="primary">再開</button><button id="homePause">タイトルへ</button>';$('#resume').onclick=togglePause;$('#homePause').onclick=title}else overlay.classList.add('hide')}$('#pause').onclick=togglePause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play'&&!paused)togglePause()});window.addEventListener('resize',fit);fit();title();requestAnimationFrame(frame);
})();
